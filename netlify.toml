# Netlify: la dirección de antes (studio-toni.netlify.app) y las vistas previas de cada PR, que no
# gastan. La web de verdad está ahora en GitHub Pages (.github/workflows/web.yml), sin límite de
# publicaciones. Publica solo lo que usa la página: ni las pruebas ni el README.
[build]
  command = "rm -rf _site && mkdir _site && cp index.html futbol.js futbol.css video.js audio.js favicon.svg manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png jornada90-logo.png _site/"
  publish = "_site"
  # Cada publicación en la web (producción) gasta 15 de los 300 créditos al mes del plan gratis
  # de Netlify, y al acabarlos se paran TODAS las webs del equipo hasta el mes siguiente. Así que
  # un cambio en main solo se publica si su mensaje lleva «[publicar]»; los demás se saltan
  # (no gastan). Las vistas previas de las PR son gratis y siguen saliendo siempre.
  ignore = "if [ \"$BRANCH\" = main ] && ! git log -1 --pretty=%B | grep -q '\\[publicar\\]'; then exit 0; else exit 1; fi"

# El aviso al móvil al pitido final ya no es una función de Netlify: lo hace el piloto automático
# en GitHub Actions (.github/workflows/piloto.yml), con el vídeo hecho.
