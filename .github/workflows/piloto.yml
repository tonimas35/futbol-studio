name: Piloto automático

# Cada 10 minutos en las horas de partidos (de 11 a 23 h UTC): mira ESPN y, cuando acaba un partido
# de tus competiciones (piloto.json), hace el vídeo con el Studio, lo publica en la web y te avisa
# al móvil con ntfy. Si alguno va por el final, se queda vigilándolo cada 30 segundos para avisar
# a los 3 o 4 minutos del pitido final. Y 3 horas antes de los partidos grandes, su previa; y al
# acabar la jornada de LaLiga, su resumen en fotos. A mano (Run workflow), hace el de un partido
# concreto.
# Ver tools/piloto.mjs. Los minutos van en lista (3, 13, 23…; no en el minuto 0, el más cargado de
# GitHub): con «3-59/10» GitHub no lanzaba ninguna. Tampoco así, de momento: el que lo lanza es el
# vigía (vigia.yml), cada 10 minutos.
on:
  schedule:
    - cron: '3,13,23,33,43,53 11-23 * * *'
  workflow_dispatch:
    inputs:
      partido:
        description: 'Un partido concreto: liga/id de ESPN (p. ej. esp.1/401882846; hace su carrusel), video:liga/id para su vídeo, previa:liga/id para su previa o jornada:esp.1 para el resumen de la jornada. Vacío: los que acaben'
        required: false
      dia:
        description: 'Su día (AAAA-MM-DD), si no es de hoy'
        required: false

permissions:
  contents: write

concurrency:
  group: piloto
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      hechos: ${{ steps.video.outputs.hechos }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar partidos acabados sin vídeo
        id: buscar
        env:
          GH_TOKEN: ${{ github.token }}
          PARTIDO: ${{ inputs.partido }}
          DIA: ${{ inputs.dia }}
        run: node tools/piloto.mjs buscar

      # Si hay un partido acabado, o alguno va por el final (y entonces se espera a su pitido final
      # con todo listo, para avisar a los 3 o 4 minutos)
      - name: Preparar el navegador y ffmpeg
        if: steps.buscar.outputs.partidos != '[]' || steps.buscar.outputs.cerca == 'true'
        run: |
          npm install --no-save --no-package-lock --silent playwright-core@1
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Esperar al pitido final
        id: esperar
        if: steps.buscar.outputs.partidos == '[]' && steps.buscar.outputs.cerca == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/piloto.mjs esperar

      - name: Hacer los vídeos
        id: video
        if: steps.buscar.outputs.partidos != '[]' || (steps.esperar.outputs.partidos != '' && steps.esperar.outputs.partidos != '[]')
        env:
          GH_TOKEN: ${{ github.token }}
          # La voz (opcional): Qwen3-TTS en Modal (la dirección como variable y su token como
          # secretos) o ElevenLabs (la clave como secreto y la voz como variable). Ver «La voz del robot»
          VOZ_URL: ${{ vars.VOZ_URL }}
          MODAL_KEY: ${{ secrets.MODAL_KEY }}
          MODAL_SECRET: ${{ secrets.MODAL_SECRET }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          PARTIDOS: ${{ steps.buscar.outputs.partidos != '[]' && steps.buscar.outputs.partidos || steps.esperar.outputs.partidos }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node tools/piloto.mjs video

  web:
    needs: video
    if: needs.video.outputs.hechos != '' && needs.video.outputs.hechos != '[]'
    uses: ./.github/workflows/web.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # También si la web ha fallado (GitHub Pages sin activar): entonces el aviso lleva el vídeo tal cual
  avisar:
    needs: [video, web]
    if: always() && needs.video.outputs.hechos != '' && needs.video.outputs.hechos != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Avisar al móvil
        env:
          HECHOS: ${{ needs.video.outputs.hechos }}
          WEB: ${{ needs.web.result }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: node tools/piloto.mjs avisar
