name: Tests

# El Studio en un navegador de verdad (Chrome del runner) y sin red: ESPN sale de tests/fixtures;
# html2canvas, JSZip y Three.js, de npm. También abierto como archivo, como lo usa Toni.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the Studio in the browser
        run: |
          npm install --no-save --no-package-lock --silent playwright-core@1 html2canvas@1.4.1 jszip@3.10.1 mp4-muxer@5.2.1 three@0.186.1
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node tests/test_futbol.mjs
